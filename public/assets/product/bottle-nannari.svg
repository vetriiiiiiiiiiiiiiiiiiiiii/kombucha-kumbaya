    <rect x="128" y="340" width="14" height="580" rx="7" fill="#fff" opacity="0.20" filter="url(#soft-nannari)"/>
    <rect x="272" y="360" width="7" height="520" rx="4" fill="#fff" opacity="0.12" filter="url(#soft-nannari)"/>
