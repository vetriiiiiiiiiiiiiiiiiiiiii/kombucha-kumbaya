<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" width="400" height="1000" role="img" aria-label="Kumbayah Nannari bottle placeholder">
  <defs>
    <linearGradient id="glass-nannari" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="0.78" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="liq-nannari" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2643C" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#B2643C" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#2B160B" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glow-nannari" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#B2643C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#B2643C" stop-opacity="0"/>
