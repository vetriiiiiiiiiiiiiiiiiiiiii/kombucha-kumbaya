<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <filter id="warp-berry" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="4" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="220" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="g-berry">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="b1-berry" cx="0.4" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#A32F51" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A32F51" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2-berry" cx="0.7" cy="0.72" r="0.55">
      <stop offset="0" stop-color="#2B0D18" stop-opacity="1"/>
      <stop offset="1" stop-color="#2B0D18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="#0A0705"/>
  <g filter="url(#warp-berry)">
    <rect width="1200" height="1500" fill="url(#b2-berry)"/>
    <ellipse cx="480" cy="520" rx="420" ry="420" fill="url(#b1-berry)"/>
    <ellipse cx="820" cy="1040" rx="360" ry="300" fill="#A32F51" opacity="0.35"/>
    <ellipse cx="300" cy="1180" rx="260" ry="220" fill="#2B0D18" opacity="0.9"/>
  </g>
  <g opacity="0.5" fill="none" stroke="#fff" stroke-opacity="0.16">
    <circle cx="392" cy="640" r="46"/><circle cx="700" cy="430" r="22"/>
    <circle cx="880" cy="760" r="64"/><circle cx="520" cy="980" r="30"/>
    <circle cx="240" cy="380" r="16"/><circle cx="960" cy="1180" r="38"/>
  </g>
  <rect width="1200" height="1500" filter="url(#g-berry)" opacity="0.75"/>
  <rect width="1200" height="1500" fill="url(#b2-berry)" opacity="0.35"/>
</svg>