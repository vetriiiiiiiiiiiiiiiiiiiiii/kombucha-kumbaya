<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="The founder placeholder">
  <defs>
    <linearGradient id="bg-e5" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1A1108"/>
      <stop offset="0.55" stop-color="#0C0906"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <radialGradient id="bloom-e5" cx="0.34" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#C9A96A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#C9A96A" stop-opacity="0"/>
    </radialGradient>
    <filter id="warp-e5" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.009" numOctaves="4" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="160" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="gr-e5">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#bg-e5)"/>
  <g filter="url(#warp-e5)" opacity="0.9">
    <rect width="1000" height="1250" fill="url(#bloom-e5)"/>
    <ellipse cx="680" cy="925" rx="360" ry="325" fill="#C9A96A" opacity="0.16"/>
  </g>

  <g stroke="#F3EDE1" stroke-opacity="0.5" stroke-width="1">
    <path d="M26 60 L26 26 L60 26"/>
    <path d="M940 26 L974 26 L974 60"/>
    <path d="M26 1190 L26 1224 L60 1224"/>
    <path d="M940 1224 L974 1224 L974 1190"/>
  </g>
  <g stroke="#F3EDE1" stroke-opacity="0.14">
    <line x1="500" y1="607" x2="500" y2="643"/>
    <line x1="482" y1="625" x2="518" y2="625"/>
  </g>

  <text x="34" y="1182" font-family="Menlo, monospace" font-size="19" letter-spacing="5" fill="#F3EDE1" fill-opacity="0.82">THE FOUNDER</text>
  <text x="34" y="1208" font-family="Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#F3EDE1" fill-opacity="0.4">PLACEHOLDER / 4:5 / REPLACE WITH PHOTOGRAPHY</text>

  <rect width="1000" height="1250" filter="url(#gr-e5)" opacity="0.8"/>
</svg>