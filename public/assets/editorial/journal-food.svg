<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Booch and food placeholder">
  <defs>
    <linearGradient id="bg-e14" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1A1108"/>
      <stop offset="0.55" stop-color="#0C0906"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <radialGradient id="bloom-e14" cx="0.34" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#F0A028" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F0A028" stop-opacity="0"/>
    </radialGradient>
    <filter id="warp-e14" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.009" numOctaves="4" seed="17" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="160" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="gr-e14">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-e14)"/>
  <g filter="url(#warp-e14)" opacity="0.9">
    <rect width="1600" height="900" fill="url(#bloom-e14)"/>
    <ellipse cx="1088" cy="666" rx="576" ry="234" fill="#F0A028" opacity="0.16"/>
  </g>

  <g stroke="#F3EDE1" stroke-opacity="0.5" stroke-width="1">
    <path d="M26 60 L26 26 L60 26"/>
    <path d="M1540 26 L1574 26 L1574 60"/>
    <path d="M26 840 L26 874 L60 874"/>
    <path d="M1540 874 L1574 874 L1574 840"/>
  </g>
  <g stroke="#F3EDE1" stroke-opacity="0.14">
    <line x1="800" y1="432" x2="800" y2="468"/>
    <line x1="782" y1="450" x2="818" y2="450"/>
  </g>

  <text x="34" y="832" font-family="Menlo, monospace" font-size="19" letter-spacing="5" fill="#F3EDE1" fill-opacity="0.82">BOOCH AND FOOD</text>
  <text x="34" y="858" font-family="Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#F3EDE1" fill-opacity="0.4">PLACEHOLDER / 16:9 / REPLACE WITH PHOTOGRAPHY</text>

  <rect width="1600" height="900" filter="url(#gr-e14)" opacity="0.8"/>
</svg>