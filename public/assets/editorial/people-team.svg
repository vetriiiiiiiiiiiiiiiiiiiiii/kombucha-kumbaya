<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1330" width="1000" height="1330" role="img" aria-label="The team placeholder">
  <defs>
    <linearGradient id="bg-e4" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1A1108"/>
      <stop offset="0.55" stop-color="#0C0906"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <radialGradient id="bloom-e4" cx="0.34" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#D7C08D" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D7C08D" stop-opacity="0"/>
    </radialGradient>
    <filter id="warp-e4" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.009" numOctaves="4" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="160" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="gr-e4">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1000" height="1330" fill="url(#bg-e4)"/>
  <g filter="url(#warp-e4)" opacity="0.9">
    <rect width="1000" height="1330" fill="url(#bloom-e4)"/>
    <ellipse cx="680" cy="984.1999999999999" rx="360" ry="345.8" fill="#D7C08D" opacity="0.16"/>
  </g>

  <g stroke="#F3EDE1" stroke-opacity="0.5" stroke-width="1">
    <path d="M26 60 L26 26 L60 26"/>
    <path d="M940 26 L974 26 L974 60"/>
    <path d="M26 1270 L26 1304 L60 1304"/>
    <path d="M940 1304 L974 1304 L974 1270"/>
  </g>
  <g stroke="#F3EDE1" stroke-opacity="0.14">
    <line x1="500" y1="647" x2="500" y2="683"/>
    <line x1="482" y1="665" x2="518" y2="665"/>
  </g>

  <text x="34" y="1262" font-family="Menlo, monospace" font-size="19" letter-spacing="5" fill="#F3EDE1" fill-opacity="0.82">THE TEAM</text>
  <text x="34" y="1288" font-family="Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#F3EDE1" fill-opacity="0.4">PLACEHOLDER / 3:4 / REPLACE WITH PHOTOGRAPHY</text>

  <rect width="1000" height="1330" filter="url(#gr-e4)" opacity="0.8"/>
</svg>