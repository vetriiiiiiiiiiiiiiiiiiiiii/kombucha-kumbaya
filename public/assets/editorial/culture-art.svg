<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Art placeholder">
  <defs>
    <linearGradient id="bg-e10" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1A1108"/>
      <stop offset="0.55" stop-color="#0C0906"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <radialGradient id="bloom-e10" cx="0.34" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#A9BE55" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#A9BE55" stop-opacity="0"/>
    </radialGradient>
    <filter id="warp-e10" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.009" numOctaves="4" seed="13" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="160" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="gr-e10">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="13"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#bg-e10)"/>
  <g filter="url(#warp-e10)" opacity="0.9">
    <rect width="900" height="1200" fill="url(#bloom-e10)"/>
    <ellipse cx="612" cy="888" rx="324" ry="312" fill="#A9BE55" opacity="0.16"/>
  </g>

  <g stroke="#F3EDE1" stroke-opacity="0.5" stroke-width="1">
    <path d="M26 60 L26 26 L60 26"/>
    <path d="M840 26 L874 26 L874 60"/>
    <path d="M26 1140 L26 1174 L60 1174"/>
    <path d="M840 1174 L874 1174 L874 1140"/>
  </g>
  <g stroke="#F3EDE1" stroke-opacity="0.14">
    <line x1="450" y1="582" x2="450" y2="618"/>
    <line x1="432" y1="600" x2="468" y2="600"/>
  </g>

  <text x="34" y="1132" font-family="Menlo, monospace" font-size="19" letter-spacing="5" fill="#F3EDE1" fill-opacity="0.82">ART</text>
  <text x="34" y="1158" font-family="Menlo, monospace" font-size="14" letter-spacing="3.5" fill="#F3EDE1" fill-opacity="0.4">PLACEHOLDER / 3:4 / REPLACE WITH PHOTOGRAPHY</text>

  <rect width="900" height="1200" filter="url(#gr-e10)" opacity="0.8"/>
